<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kansas Legislation Tracker</title>
<style>
  :root {
    --ink: #1c2430; --muted: #5b6573; --line: #dde2e8; --bg: #f6f7f9; --card: #fff;
    --brand: #1f3a5f; --brand-2: #2d5b8f; --accent: #c8962e; --chip: #eef2f7;
    --new: #1d7a46; --warn: #a4471b; --radius: 10px;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font: 15px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
         color: var(--ink); background: var(--bg); }
  header { background: var(--brand); color: #fff; padding: 18px 20px 14px; }
  header h1 { margin: 0; font-size: 21px; letter-spacing: .2px; }
  header .sub { margin-top: 4px; color: #cfd9e6; font-size: 13px; }
  .badge { display: inline-block; padding: 1px 8px; border-radius: 99px; font-size: 12px; font-weight: 600;
           background: rgba(255,255,255,.15); color: #fff; margin-left: 6px; }
  .badge.on { background: var(--accent); color: #1c1300; }
  main { max-width: 1280px; margin: 0 auto; padding: 14px 16px 40px; }
  .tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line); margin-bottom: 12px; }
  .tab { border: 0; background: none; padding: 10px 14px; font: inherit; font-weight: 600; color: var(--muted);
         cursor: pointer; border-bottom: 3px solid transparent; }
  .tab.active { color: var(--brand); border-bottom-color: var(--accent); }
  .tab .n { font-weight: 500; color: var(--muted); }
  .toolbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 8px; }
  .search { flex: 1 1 260px; position: relative; }
  .search input { width: 100%; padding: 9px 12px 9px 34px; border: 1px solid var(--line); border-radius: 8px;
                  font: inherit; background: var(--card); }
  .search svg { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); opacity: .5; }
  .btn { border: 1px solid var(--line); background: var(--card); border-radius: 8px; padding: 8px 12px;
         font: inherit; font-size: 14px; cursor: pointer; color: var(--ink); white-space: nowrap; }
  .btn:hover { border-color: #b7c0cc; }
  .btn.active { border-color: var(--brand-2); background: #e8f0fa; color: var(--brand); font-weight: 600; }
  .btn.primary { background: var(--brand); color: #fff; border-color: var(--brand); }
  .btn.link { border: 0; background: none; color: var(--brand-2); padding: 8px 6px; }
  select.btn { padding-right: 8px; }
  .filters { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-bottom: 10px; }
  .filters .label { color: var(--muted); font-size: 13px; margin-right: 2px; }
  .count { color: var(--muted); font-size: 13px; margin: 4px 0 8px; }
  .caret { font-size: 10px; margin-left: 4px; opacity: .7; }

  /* table */
  .tablewrap { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; }
  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: left; padding: 10px 12px; vertical-align: top; border-bottom: 1px solid var(--line); }
  th { background: #f0f3f7; font-size: 12.5px; text-transform: uppercase; letter-spacing: .4px; color: var(--muted);
       position: sticky; top: 0; z-index: 1; white-space: nowrap; user-select: none; }
  th .sort { cursor: pointer; }
  th .fbtn { border: 0; background: none; cursor: pointer; padding: 2px 4px; margin-left: 2px; color: var(--muted);
             border-radius: 4px; font-size: 11px; }
  th .fbtn.on { background: var(--brand-2); color: #fff; }
  tbody tr.row { cursor: pointer; }
  tbody tr.row:hover { background: #fafbfd; }
  td.bill a { font-weight: 700; color: var(--brand); text-decoration: none; white-space: nowrap; }
  td.title { min-width: 260px; }
  .ltitle { color: var(--muted); font-size: 13px; margin-top: 2px; }
  .chip { display: inline-block; background: var(--chip); color: #29405e; border-radius: 99px; padding: 1px 8px;
          font-size: 12px; margin: 1px 3px 1px 0; white-space: nowrap; }
  .stage { font-weight: 600; font-size: 13px; white-space: nowrap; }
  .stage.Enacted, .stage.Adopted { color: var(--new); }
  .stage.Vetoed, .stage.Dead { color: var(--warn); }
  .when { color: var(--muted); font-size: 12.5px; white-space: nowrap; }
  .newtag { background: #dff3e7; color: var(--new); font-size: 11px; font-weight: 700; border-radius: 4px;
            padding: 0 5px; margin-left: 6px; vertical-align: 1px; }
  tr.detail td { background: #fbfcfe; padding: 4px 16px 16px; }
  .detail-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px 28px; font-size: 13.5px; }
  .detail-grid h4 { margin: 10px 0 4px; font-size: 12px; text-transform: uppercase; letter-spacing: .4px; color: var(--muted); }
  .hist { list-style: none; margin: 0; padding: 0; max-height: 280px; overflow: auto; }
  .hist li { padding: 4px 0; border-bottom: 1px dashed var(--line); }
  .hist .d { color: var(--muted); font-size: 12px; margin-right: 6px; white-space: nowrap; }
  .empty { padding: 36px; text-align: center; color: var(--muted); }

  /* hearings */
  .hcards { display: grid; gap: 10px; }
  .hcard { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 12px 14px;
           display: grid; grid-template-columns: 120px 1fr; gap: 12px; }
  .hcard .date { font-weight: 700; color: var(--brand); }
  .hcard .time { color: var(--muted); font-size: 13px; }
  .hcard .committee { font-weight: 600; }
  .hcard .desc { color: var(--muted); font-size: 13.5px; margin-top: 2px; }
  .hcard.past { opacity: .75; }

  /* popover (Excel-style filter) */
  .pop { position: absolute; z-index: 50; background: #fff; border: 1px solid #c9d1db; border-radius: 10px;
         box-shadow: 0 10px 30px rgba(20,30,50,.18); width: 290px; max-width: calc(100vw - 20px); display: none; }
  .pop.open { display: block; }
  .pop .ph { padding: 10px 12px 6px; font-weight: 700; font-size: 14px; }
  .pop .ps { padding: 0 12px 8px; }
  .pop .ps input { width: 100%; padding: 7px 9px; border: 1px solid var(--line); border-radius: 6px; font: inherit; font-size: 14px; }
  .pop .pl { max-height: 280px; overflow: auto; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); padding: 4px 0; }
  .pop label { display: flex; align-items: center; gap: 8px; padding: 5px 12px; cursor: pointer; font-size: 14px; }
  .pop label:hover { background: #f4f7fb; }
  .pop label .c { margin-left: auto; color: var(--muted); font-size: 12px; }
  .pop label.all { font-weight: 600; }
  .pop .pf { display: flex; justify-content: space-between; gap: 8px; padding: 8px 12px; }
  .pop input[type=checkbox] { width: 16px; height: 16px; accent-color: var(--brand-2); }

  td.sel, th.sel { width: 34px; padding-right: 0; }
  td.sel input, th.sel input { width: 17px; height: 17px; accent-color: var(--brand-2); cursor: pointer; vertical-align: -3px; }
  tr.row.selected { background: #eef4fc; }
  .selbar { display: none; align-items: center; gap: 10px; background: #e8f0fa; border: 1px solid #bcd0ea; color: var(--brand);
            border-radius: 8px; padding: 6px 10px; margin-bottom: 8px; font-size: 14px; }
  .selbar.on { display: flex; }
  .btn.excel { background: #1d6f42; border-color: #1d6f42; color: #fff; font-weight: 600; }
  .btn.excel:hover { background: #185c37; }
  .hcard .bt { font-size: 13.5px; margin-top: 3px; }
  .hcard .bt a { font-weight: 600; color: var(--brand); text-decoration: none; }
  .hcard .why { color: var(--muted); font-size: 12px; margin-top: 4px; }
  .tag-cancel { background: #fbe4dc; color: var(--warn); font-size: 11px; font-weight: 700; border-radius: 4px; padding: 0 6px; margin-left: 6px; }
  .live { font-size: 12.5px; margin-left: 8px; color: var(--brand-2); }
  .btn.report { background: var(--brand); border-color: var(--brand); color: #fff; font-weight: 600; }
  .btn.report:hover { background: var(--brand-2); }
  .modal-bg { position: fixed; inset: 0; background: rgba(15,25,40,.45); z-index: 100; display: none; align-items: center; justify-content: center; padding: 16px; }
  .modal-bg.open { display: flex; }
  .modal { background: #fff; border-radius: 12px; width: 680px; max-width: 100%; max-height: calc(100vh - 32px); display: flex; flex-direction: column;
           box-shadow: 0 20px 60px rgba(10,20,40,.3); }
  .modal header { background: none; color: var(--ink); padding: 16px 18px 8px; display: flex; justify-content: space-between; align-items: center; }
  .modal header h2 { margin: 0; font-size: 18px; color: var(--brand); }
  .modal .x { border: 0; background: none; font-size: 22px; cursor: pointer; color: var(--muted); line-height: 1; }
  .modal .body { padding: 4px 18px 8px; overflow: auto; }
  .modal label.f { display: block; font-size: 13px; color: var(--muted); margin: 8px 0 4px; font-weight: 600; }
  .modal input[type=text], .modal input[type=search] { width: 100%; padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; font: inherit; }
  .picker-tools { display: flex; gap: 8px; align-items: center; margin: 8px 0 6px; flex-wrap: wrap; }
  .picker-tools .n { margin-left: auto; font-size: 13px; color: var(--brand); font-weight: 600; }
  .picker { border: 1px solid var(--line); border-radius: 8px; max-height: 300px; overflow: auto; }
  .picker label { display: grid; grid-template-columns: 22px 78px 1fr; gap: 8px; align-items: start; padding: 7px 10px; border-bottom: 1px solid #eef1f5; cursor: pointer; font-size: 14px; }
  .picker label:hover { background: #f6f9fd; }
  .picker label b { color: var(--brand); }
  .picker label .s { display: block; color: var(--muted); font-size: 12px; }
  .picker input { width: 17px; height: 17px; accent-color: var(--brand-2); margin-top: 1px; }
  .opts { display: flex; gap: 16px; flex-wrap: wrap; margin: 10px 0 2px; font-size: 14px; }
  .opts input { accent-color: var(--brand-2); width: 16px; height: 16px; vertical-align: -3px; margin-right: 4px; }
  .modal footer { margin: 0; padding: 12px 18px 16px; display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap; border-top: 1px solid var(--line); }
  .modal .hint { font-size: 12.5px; color: var(--muted); flex: 1 1 100%; }
  .modal footer .btn { flex: 0 0 auto; }
  @media (max-width: 760px) { .modal footer .btn { flex: 1 1 100%; } .modal-bg { padding: 8px; } }
  footer { color: var(--muted); font-size: 12.5px; margin-top: 18px; }
  footer a { color: var(--brand-2); }
  .mobile-sort { display: none; }

  @media (max-width: 760px) {
    header { padding: 14px 14px 12px; }
    main { padding: 10px 10px 30px; }
    .mobile-sort { display: inline-block; }
    .tab { padding: 10px 8px; font-size: 14px; white-space: nowrap; }
    thead { display: none; }
    table, tbody, tr, td { display: block; width: 100%; }
    tbody tr.row { border-bottom: 1px solid var(--line); padding: 10px 12px; }
    tbody tr.row td { border: 0; padding: 2px 0; }
    td.title { min-width: 0; }
    td[data-l]:before { content: attr(data-l) ": "; color: var(--muted); font-size: 12px; }
    td.c-type, td.c-chamber { display: inline-block; width: auto; margin-right: 10px; }
    tbody tr.row td.sel { float: right; width: auto; padding: 2px 0 0 10px; }
    .detail-grid { grid-template-columns: 1fr; }
    .hcard { grid-template-columns: 1fr; gap: 4px; }
  }
</style>
</head>
<body>
<header>
  <h1>Kansas Legislation Tracker</h1>
  <div class="sub" id="sub">Loading…</div>
</header>

<main>
  <nav class="tabs" role="tablist">
    <button class="tab active" data-tab="bills">Bills &amp; Resolutions <span class="n" id="n-bills"></span></button>
    <button class="tab" data-tab="hearings">Hearings <span class="n" id="n-hearings"></span></button>
  </nav>

  <!-- ===================== BILLS ===================== -->
  <section id="tab-bills">
    <div class="toolbar">
      <div class="search">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input id="q" type="search" placeholder="Search bills by keyword, number, sponsor, committee…" autocomplete="off">
      </div>
      <select id="recent" class="btn" title="Show only recently changed items">
        <option value="">Any time</option>
        <option value="1">Changed today</option>
        <option value="7">Changed in last 7 days</option>
        <option value="30">Changed in last 30 days</option>
      </select>
      <select id="msort" class="btn mobile-sort" title="Sort">
        <option value="last_action_date:desc">Newest activity</option>
        <option value="bill_no:asc">Bill number</option>
        <option value="stage:asc">Stage</option>
      </select>
      <button class="btn report" id="buildreport" title="Pick bills and resolutions and download a summary report">Build report</button>
      <button class="btn excel" id="export" title="Download the bills shown (or the ones you've checked) as an Excel file">Export to Excel</button>
    </div>
    <div class="filters" id="filterbar">
      <span class="label">Filter:</span>
      <button class="btn" data-filter="topics">Topics<span class="caret">▼</span></button>
      <button class="btn" data-filter="stage">Stage<span class="caret">▼</span></button>
      <button class="btn" data-filter="kind">Bill / Resolution<span class="caret">▼</span></button>
      <button class="btn" data-filter="chamber">Chamber<span class="caret">▼</span></button>
      <button class="btn" data-filter="committees">Committee<span class="caret">▼</span></button>
      <button class="btn" data-filter="match_sources">Found in<span class="caret">▼</span></button>
      <button class="btn link" id="clear">Clear all filters</button>
    </div>
    <div class="count" id="count"></div>
    <div class="selbar" id="selbar"><span id="seltext"></span><button class="btn link" id="selclear">Clear selection</button></div>
    <div class="tablewrap">
      <table>
        <thead><tr>
          <th class="sel"><input type="checkbox" id="selall" title="Select all shown"></th>
          <th><span class="sort" data-sort="bill_no">Bill</span></th>
          <th><span class="sort" data-sort="short_title">Title</span></th>
          <th>Topics <button class="fbtn" data-filter="topics" title="Filter topics">▼</button></th>
          <th><span class="sort" data-sort="stage">Stage</span> <button class="fbtn" data-filter="stage" title="Filter stage">▼</button></th>
          <th><span class="sort" data-sort="last_action_date">Last action</span></th>
          <th>Chamber <button class="fbtn" data-filter="chamber" title="Filter chamber">▼</button></th>
          <th>Type <button class="fbtn" data-filter="kind" title="Filter type">▼</button></th>
        </tr></thead>
        <tbody id="rows"></tbody>
      </table>
    </div>
  </section>

  <!-- ===================== HEARINGS ===================== -->
  <section id="tab-hearings" hidden>
    <div class="toolbar">
      <div class="search">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input id="hq" type="search" placeholder="Search hearings…" autocomplete="off">
      </div>
      <select id="hwhen" class="btn">
        <option value="upcoming">Upcoming</option>
        <option value="past">Past</option>
        <option value="all">All</option>
      </select>
      <button class="btn" data-hfilter="topics">Topics<span class="caret">▼</span></button>
      <button class="btn" data-hfilter="committee">Committee<span class="caret">▼</span></button>
      <button class="btn" data-hfilter="matched_by">Matched by<span class="caret">▼</span></button>
      <button class="btn excel" id="hexport" title="Download the hearings shown as an Excel file">Export to Excel</button>
    </div>
    <div class="count" id="hcount"></div>
    <div class="hcards" id="hcards"></div>
  </section>

  <footer id="foot"></footer>
</main>

<div class="modal-bg" id="rmodal" role="dialog" aria-modal="true" aria-labelledby="rtitle-h">
  <div class="modal">
    <header><h2 id="rtitle-h">Build report</h2><button class="x" id="rclose" aria-label="Close">×</button></header>
    <div class="body">
      <label class="f" for="rtitle">Report title</label>
      <input type="text" id="rtitle" value="Kansas Legislation Report">
      <label class="f">Choose bills and resolutions</label>
      <input type="search" id="rq" placeholder="Search by number, title, topic, sponsor…">
      <div class="picker-tools">
        <button class="btn" id="rall">Select all shown</button>
        <button class="btn link" id="rnone">Clear</button>
        <label style="font-size:13px"><input type="checkbox" id="ronly"> Show selected only</label>
        <span class="n" id="rcount"></span>
      </div>
      <div class="picker" id="rlist"></div>
      <label class="f">Include</label>
      <div class="opts">
        <label><input type="checkbox" id="o-votes" checked>Votes</label>
        <label><input type="checkbox" id="o-hearings" checked>Hearings</label>
        <label><input type="checkbox" id="o-history" checked>Full action history</label>
      </div>
    </div>
    <footer>
      <span class="hint">Every report includes status, sponsors and the run date.</span>
      <button class="btn" id="rpdf">Print / Save as PDF</button>
      <button class="btn report" id="rdocx">Download Word report</button>
    </footer>
  </div>
</div>

<div class="pop" id="pop">
  <div class="ph" id="pop-title"></div>
  <div class="ps"><input id="pop-search" type="search" placeholder="Search values…"></div>
  <div class="pl" id="pop-list"></div>
  <div class="pf">
    <button class="btn link" id="pop-clear">Clear</button>
    <span><button class="btn" id="pop-cancel">Cancel</button> <button class="btn primary" id="pop-ok">OK</button></span>
  </div>
</div>

<script src="xlsx-writer.js"></script>
<script src="report.js"></script>
<script>
(() => {
  const $ = s => document.querySelector(s);
  const $$ = s => [...document.querySelectorAll(s)];
  const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
  const fmtDate = d => { if (!d) return ""; const x = new Date(d + "T12:00:00"); return isNaN(x) ? d : x.toLocaleDateString(undefined, {month:"short", day:"numeric", year:"numeric"}); };
  const STORE = "ksleg-filters-v1";

  const FILTER_LABELS = { topics: "Topics", stage: "Stage", kind: "Bill / Resolution", chamber: "Chamber",
                          committees: "Committee", match_sources: "Found in", committee: "Committee",
                          matched_by: "Matched by" };
  const STAGE_ORDER = ["Introduced","In committee","Hearing held/scheduled","Reported by committee","Passed House","Passed Senate",
                       "In conference","Passed both chambers","Sent to Governor","Enacted","Adopted","Veto overridden","Vetoed","Dead"];

  let META = {}, BILLS = [], HEARINGS = [], TOPICS = [];
  let state = { q: "", recent: "", sort: "last_action_date", dir: "desc", f: {}, hq: "", hwhen: "upcoming", hf: {}, open: {}, sel: [] };
  try { Object.assign(state, JSON.parse(localStorage.getItem(STORE) || "{}"), { open: {} }); } catch (e) {}
  const save = () => { try { const { open, ...s } = state; localStorage.setItem(STORE, JSON.stringify(s)); } catch (e) {} };

  const asList = v => Array.isArray(v) ? v : (v ? [v] : []);
  const valuesOf = (item, key) => { const v = asList(item[key]); return v.length ? v : ["(none)"]; };

  // ---------------------------------------------------------------- load
  Promise.all([
    fetch("data/bills.json", {cache: "no-store"}).then(r => r.ok ? r.json() : {}).catch(() => ({})),
    fetch("data/hearings.json", {cache: "no-store"}).then(r => r.ok ? r.json() : {}).catch(() => ({})),
  ]).then(([b, h]) => {
    META = b || {}; BILLS = (b && b.bills) || []; HEARINGS = (h && h.hearings) || [];
    TOPICS = META.topics || (h && h.topics) || [];
    BILLS.forEach(x => {
      x._search = [x.name, x.bill_no, x.short_title, x.long_title, (x.sponsors||[]).join(" "), (x.topics||[]).join(" "),
                   (x.committees||[]).join(" "), (x.matched_keywords||[]).join(" "), x.last_action, x.stage].join(" ").toLowerCase();
    });
    HEARINGS.forEach(x => {
      x._search = [x.committee, x.description, (x.bills||[]).join(" "), (x.topics||[]).join(" "), x.room, x.chamber,
                   (x.bill_details||[]).map(d => d.title).join(" "), (x.matched_keywords||[]).join(" ")].join(" ").toLowerCase();
      if (!x.committee) x.committee = x.chamber ? x.chamber + " committee" : "Committee";
    });
    // Out of session there are no upcoming hearings; show past ones instead of an empty list
    const t = new Date().toISOString().slice(0,10);
    if (state.hwhen === "upcoming" && !HEARINGS.some(x => (x.date || "") >= t)) state.hwhen = "past";
    header(); renderBills(); renderHearings();
  });

  function header() {
    const live = META.in_session ? '<span class="badge on">In session</span>' : '<span class="badge">Out of session</span>';
    $("#sub").innerHTML = META.generated_at
      ? `Updated ${esc(new Date(META.generated_at).toLocaleString(undefined, {dateStyle:"medium", timeStyle:"short"}))} · ${esc(META.scan_mode || "")} ${live}`
      : "No data yet — the first scan will fill this page.";
    const m = location.hostname.match(/^([^.]+)\.github\.io$/);
    const repo = m ? `https://github.com/${m[1]}/${location.pathname.split("/")[1]}` : null;
    $("#foot").innerHTML = `Source: Kansas Legislature (kslegislature.gov). ` +
      `Data file: <a href="data/tracked_bills.csv">tracked_bills.csv</a>` +
      (repo ? ` · <a href="${repo}/tree/main/reports">Scan updates &amp; monthly reports</a> · <a href="${repo}/blob/main/config.yml">Edit topics</a>` : "");
  }

  // ---------------------------------------------------------------- bills
  function billPasses(b, skipKey) {
    if (state.q) { for (const w of state.q.toLowerCase().split(/\s+/).filter(Boolean)) if (!b._search.includes(w)) return false; }
    if (state.recent) {
      const cut = new Date(); cut.setDate(cut.getDate() - (+state.recent - 1)); const c = cut.toISOString().slice(0,10);
      if (!((b.last_changed || "") >= c || (b.last_action_date || "") >= c)) return false;
    }
    for (const [k, sel] of Object.entries(state.f)) {
      if (k === skipKey || !sel || !sel.length) continue;
      if (!valuesOf(b, k).some(v => sel.includes(v))) return false;
    }
    return true;
  }

  function sorted(list) {
    const { sort, dir } = state, m = dir === "asc" ? 1 : -1;
    const key = b => {
      if (sort === "bill_no") { const p = b.bill_no.match(/^([A-Z]+)(\d+)/); return p ? p[1].padEnd(4) + p[2].padStart(6, "0") : b.bill_no; }
      if (sort === "stage") return String(STAGE_ORDER.indexOf(b.stage)).padStart(3, "0");
      return (b[sort] || "").toString().toLowerCase();
    };
    return [...list].sort((a, b) => (key(a) < key(b) ? -1 : key(a) > key(b) ? 1 : 0) * m);
  }

  function renderBills() {
    const list = sorted(BILLS.filter(b => billPasses(b)));
    $("#n-bills").textContent = `(${BILLS.length})`;
    $("#q").value = state.q; $("#recent").value = state.recent;
    $("#msort").value = `${state.sort}:${state.dir}`;
    const nf = Object.values(state.f).filter(v => v && v.length).length;
    $("#count").textContent = `Showing ${list.length} of ${BILLS.length}` + (nf ? ` · ${nf} filter${nf > 1 ? "s" : ""} on` : "");
    $$("[data-filter]").forEach(el => el.classList.toggle(el.classList.contains("fbtn") ? "on" : "active",
                                                          !!(state.f[el.dataset.filter] || []).length));
    $$("th .sort").forEach(el => el.textContent = el.textContent.replace(/ [▲▼]$/, "") + (el.dataset.sort === state.sort ? (state.dir === "asc" ? " ▲" : " ▼") : ""));
    const selected = new Set(state.sel);
    const shownSel = list.filter(b => selected.has(b.bill_no)).length;
    $("#selall").checked = list.length > 0 && shownSel === list.length;
    $("#selall").indeterminate = shownSel > 0 && shownSel < list.length;
    $("#selbar").classList.toggle("on", selected.size > 0);
    const hidden = selected.size - shownSel;
    $("#seltext").textContent = `${selected.size} selected` + (hidden > 0 ? ` (${hidden} hidden by filters)` : "");
    $("#export").textContent = selected.size ? `Export ${selected.size} selected to Excel` : `Export ${list.length} to Excel`;
    const rows = list.map(b => {
      const isOpen = state.open[b.bill_no];
      const on = selected.has(b.bill_no);
      let html = `<tr class="row${on ? " selected" : ""}" data-id="${esc(b.bill_no)}">
        <td class="sel"><input type="checkbox" data-sel="${esc(b.bill_no)}" ${on ? "checked" : ""} aria-label="Select ${esc(b.name)}"></td>
        <td class="bill"><a href="${esc(b.url)}" target="_blank" rel="noopener">${esc(b.name || b.bill_no)}</a>${b.last_changed === META.scan_date && b.first_seen !== b.last_changed ? '<span class="newtag">UPDATED</span>' : ""}${b.first_seen === META.scan_date && b.first_seen !== META.first_scan ? '<span class="newtag">NEW</span>' : ""}</td>
        <td class="title">${esc(b.short_title || b.long_title)}${b.short_title && b.long_title && b.long_title !== b.short_title ? `<div class="ltitle">${esc(trunc(b.long_title, 180))}</div>` : ""}</td>
        <td data-l="Topics">${(b.topics||[]).map(t => `<span class="chip">${esc(t)}</span>`).join("")}</td>
        <td data-l="Stage"><span class="stage ${esc((b.stage||"").split(" ")[0])}">${esc(b.stage)}</span></td>
        <td data-l="Last action">${esc(trunc(b.last_action, 90))}<div class="when">${esc(fmtDate(b.last_action_date))}</div></td>
        <td class="c-chamber" data-l="Chamber">${esc(b.chamber)}</td>
        <td class="c-type" data-l="Type">${esc(b.type)}</td></tr>`;
      if (isOpen) html += `<tr class="detail"><td colspan="8">${detail(b)}</td></tr>`;
      return html;
    }).join("");
    $("#rows").innerHTML = rows || `<tr><td colspan="8" class="empty">${BILLS.length ? "No items match these filters." : "No tracked items yet."}</td></tr>`;
  }
  const trunc = (s, n) => (s = s || "", s.length > n ? s.slice(0, n - 1) + "…" : s);
  const daysAgo = n => { const d = new Date(); d.setDate(d.getDate() - n); return d.toISOString().slice(0,10); };

  function detail(b) {
    const hist = [...(b.history || [])].reverse().map(h =>
      `<li><span class="d">${esc(fmtDate(h.date))}</span>${h.chamber ? `<b>${esc(h.chamber)}</b> · ` : ""}${esc(h.action)}</li>`).join("");
    return `<div class="detail-grid">
      <div>
        <h4>Full title</h4><div>${esc(b.long_title || b.short_title)}</div>
        <h4>Sponsors</h4><div>${esc((b.sponsors||[]).join("; ") || "—")}</div>
        <h4>Committees</h4><div>${esc((b.committees||[]).join("; ") || "—")}</div>
        ${(b.votes||[]).length ? `<h4>Votes</h4><div>${b.votes.map(v => `${esc(fmtDate(v.date))} · ${esc(v.chamber)} · ${esc(v.action || v.motion || "Roll call")}: <b>${v.yea}–${v.nay}</b>`).join("<br>")}</div>` : ""}
        <h4>Why it's tracked</h4><div>Keywords: ${esc((b.matched_keywords||[]).join(", "))} · Found in: ${esc((b.match_sources||[]).join(", "))}</div>
        <h4>Links</h4><div><a href="${esc(b.url)}" target="_blank" rel="noopener">Official bill page (text, fiscal note, testimony) ↗</a></div>
      </div>
      <div><h4>History (${(b.history||[]).length})</h4><ul class="hist">${hist || "<li>No actions recorded yet.</li>"}</ul></div>
    </div>`;
  }

  $("#rows").addEventListener("click", e => {
    const cb = e.target.closest("input[data-sel]");
    if (cb) {
      const set = new Set(state.sel);
      cb.checked ? set.add(cb.dataset.sel) : set.delete(cb.dataset.sel);
      state.sel = [...set]; save(); renderBills(); return;
    }
    if (e.target.closest("a, td.sel")) return;
    const tr = e.target.closest("tr.row"); if (!tr) return;
    const id = tr.dataset.id; state.open[id] = !state.open[id]; renderBills();
  });
  $("#q").addEventListener("input", e => { state.q = e.target.value; save(); renderBills(); });
  $("#recent").addEventListener("change", e => { state.recent = e.target.value; save(); renderBills(); });
  $("#msort").addEventListener("change", e => { [state.sort, state.dir] = e.target.value.split(":"); save(); renderBills(); });
  $$("th .sort").forEach(el => el.addEventListener("click", () => {
    const k = el.dataset.sort;
    if (state.sort === k) state.dir = state.dir === "asc" ? "desc" : "asc";
    else { state.sort = k; state.dir = k === "last_action_date" ? "desc" : "asc"; }
    save(); renderBills();
  }));
  $("#clear").addEventListener("click", () => { state.f = {}; state.q = ""; state.recent = ""; save(); renderBills(); });
  $("#selall").addEventListener("change", e => {
    const list = BILLS.filter(b => billPasses(b)), set = new Set(state.sel);
    list.forEach(b => e.target.checked ? set.add(b.bill_no) : set.delete(b.bill_no));
    state.sel = [...set]; save(); renderBills();
  });
  $("#selclear").addEventListener("click", () => { state.sel = []; save(); renderBills(); });

  function filterSummary(isHearing) {
    const parts = [];
    const q = isHearing ? state.hq : state.q, f = isHearing ? state.hf : state.f;
    if (q) parts.push(`search "${q}"`);
    if (!isHearing && state.recent) parts.push(`changed in last ${state.recent} day(s)`);
    if (isHearing) parts.push(state.hwhen === "all" ? "all dates" : state.hwhen);
    for (const [k, v] of Object.entries(f)) if (v && v.length) parts.push(`${FILTER_LABELS[k] || k}: ${v.join(", ")}`);
    return parts.length ? parts.join(" · ") : "none";
  }
  const stamp = () => new Date().toLocaleString(undefined, {dateStyle: "medium", timeStyle: "short"});
  const today10 = () => { const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`; };

  const HEARING_COLS = [
    {header: "Date", type: "date", width: 13}, {header: "Time", width: 10}, {header: "Committee", type: "wrap", width: 30},
    {header: "Room", width: 9}, {header: "Bills", type: "wrap", width: 14}, {header: "Bill titles", type: "wrap", width: 60},
    {header: "Topics", type: "wrap", width: 26}, {header: "Matched by", type: "wrap", width: 18}, {header: "Status", width: 11},
    {header: "Link", type: "link", width: 14}];
  const hearingRow = h => [h.date, h.time, h.committee, h.room, (h.bills || []).join(", "),
    (h.bill_details || []).map(d => `${d.name}: ${d.title}`).join("\n") || h.description,
    (h.topics || []).join(", "), (h.matched_by || []).join(", "), h.status || ((h.date || "") < today10() ? "Held" : "Scheduled"),
    {text: "Open", url: h.url}];

  $("#export").addEventListener("click", () => {
    const selected = new Set(state.sel);
    const list = selected.size ? sorted(BILLS.filter(b => selected.has(b.bill_no))) : sorted(BILLS.filter(b => billPasses(b)));
    if (!list.length) { alert("There are no bills to export."); return; }
    const which = selected.size ? `${list.length} selected bill(s)` : `${list.length} bill(s) shown · Filters: ${filterSummary(false)}`;
    const bills = {
      name: "Bills",
      title: `Kansas legislation tracker — exported ${stamp()} — ${which}`,
      columns: [
        {header: "Bill", type: "link", width: 12}, {header: "Short title", type: "wrap", width: 50},
        {header: "Topics", type: "wrap", width: 24}, {header: "Stage", width: 20},
        {header: "Last action", type: "wrap", width: 44}, {header: "Last action date", type: "date", width: 15},
        {header: "Introduced", type: "date", width: 13}, {header: "Chamber", width: 10}, {header: "Type", width: 20},
        {header: "Sponsors", type: "wrap", width: 34}, {header: "Committees", type: "wrap", width: 30},
        {header: "Matched keywords", type: "wrap", width: 24}, {header: "Found in", width: 12},
        {header: "Full title", type: "wrap", width: 70}],
      rows: list.map(b => [{text: b.name || b.bill_no, url: b.url}, b.short_title || b.long_title, (b.topics || []).join(", "),
        b.stage, b.last_action, b.last_action_date, b.intro_date, b.chamber, b.type, (b.sponsors || []).join("; "),
        (b.committees || []).join("; "), (b.matched_keywords || []).join(", "), (b.match_sources || []).join(", "), b.long_title]),
    };
    const nos = new Set(list.map(b => b.bill_no));
    const hs = HEARINGS.filter(h => (h.bills || []).some(x => nos.has(x)))
      .sort((a, b) => ((a.date||"") + (a.time||"")).localeCompare((b.date||"") + (b.time||"")));
    const hearings = { name: "Hearings", title: `Hearings on these bills (${hs.length})`, columns: HEARING_COLS, rows: hs.map(hearingRow) };
    const hist = [];
    list.forEach(b => (b.history || []).forEach(h => hist.push([b.name || b.bill_no, h.date, h.chamber, h.action])));
    const history = { name: "Action history", title: "Full action history", rows: hist,
      columns: [{header: "Bill", width: 12}, {header: "Date", type: "date", width: 13}, {header: "Chamber", width: 10},
                {header: "Action", type: "wrap", width: 90}] };
    XlsxWriter.download(XlsxWriter.build([bills, hearings, history]), `KS-legislation-${today10()}.xlsx`);
  });

  // ---------------------------------------------------------------- build report
  let rsel = new Set();
  const rmodal = $("#rmodal");
  function rList() {
    const q = $("#rq").value.toLowerCase().split(/\s+/).filter(Boolean);
    const only = $("#ronly").checked;
    const list = sorted(BILLS).filter(b => (!only || rsel.has(b.bill_no)) && q.every(w => b._search.includes(w)));
    $("#rlist").innerHTML = list.map(b => `<label><input type="checkbox" value="${esc(b.bill_no)}" ${rsel.has(b.bill_no) ? "checked" : ""}>
      <b>${esc(b.name)}</b><span>${esc(trunc(b.short_title || b.long_title, 140))}<span class="s">${esc(b.stage)} · ${esc((b.topics || []).join(", "))}</span></span></label>`).join("")
      || `<div class="empty" style="padding:20px">No matches.</div>`;
    $("#rcount").textContent = `${rsel.size} selected`;
    $("#rdocx").disabled = $("#rpdf").disabled = rsel.size === 0;
    return list;
  }
  $("#buildreport").addEventListener("click", () => {
    // Start from the bills checked in the table, or from what's currently shown when nothing is checked
    rsel = new Set(state.sel.length ? state.sel : []);
    $("#rq").value = ""; $("#ronly").checked = rsel.size > 0;
    rList(); rmodal.classList.add("open"); setTimeout(() => $("#rq").focus(), 50);
  });
  const rClose = () => rmodal.classList.remove("open");
  $("#rclose").addEventListener("click", rClose);
  rmodal.addEventListener("click", e => { if (e.target === rmodal) rClose(); });
  $("#rq").addEventListener("input", rList);
  $("#ronly").addEventListener("change", rList);
  $("#rlist").addEventListener("change", e => { const c = e.target; if (c.value) { c.checked ? rsel.add(c.value) : rsel.delete(c.value); rList(); } });
  $("#rall").addEventListener("click", () => { $$("#rlist input").forEach(c => rsel.add(c.value)); rList(); });
  $("#rnone").addEventListener("click", () => { rsel.clear(); $("#ronly").checked = false; rList(); });
  function reportModel() {
    const bills = sorted(BILLS.filter(b => rsel.has(b.bill_no)));
    state.sel = [...rsel]; save(); renderBills();   // keep the table's checkboxes in step
    return ReportBuilder.model(bills, HEARINGS, META, {
      title: $("#rtitle").value.trim() || "Kansas Legislation Report",
      votes: $("#o-votes").checked, hearings: $("#o-hearings").checked, history: $("#o-history").checked });
  }
  const fileSafe = s => s.replace(/[^\w\- ]+/g, "").trim().replace(/\s+/g, "-").slice(0, 60) || "report";
  $("#rdocx").addEventListener("click", () => {
    if (!rsel.size) return;
    const m = reportModel();
    XlsxWriter.download(ReportBuilder.docx(m), `${fileSafe(m.title)}-${today10()}.docx`);
  });
  $("#rpdf").addEventListener("click", () => {
    if (!rsel.size) return;
    const w = window.open("", "_blank");
    const html = ReportBuilder.html(reportModel());
    if (w) { w.document.open(); w.document.write(html); w.document.close(); }
    else { XlsxWriter.download(new Blob([html], {type: "text/html"}), `report-${today10()}.html`); }
  });

  // ---------------------------------------------------------------- hearings
  function hearingPasses(h, skipKey) {
    const today = new Date().toISOString().slice(0,10);
    if (state.hwhen === "upcoming" && (h.date || "") < today) return false;
    if (state.hwhen === "past" && (h.date || "") >= today) return false;
    if (state.hq) { for (const w of state.hq.toLowerCase().split(/\s+/).filter(Boolean)) if (!h._search.includes(w)) return false; }
    for (const [k, sel] of Object.entries(state.hf)) {
      if (k === skipKey || !sel || !sel.length) continue;
      if (!valuesOf(h, k).some(v => sel.includes(v))) return false;
    }
    return true;
  }
  function renderHearings() {
    $("#hq").value = state.hq; $("#hwhen").value = state.hwhen;
    let list = HEARINGS.filter(h => hearingPasses(h));
    list.sort((a, b) => ((a.date||"") + (a.time||"")).localeCompare((b.date||"") + (b.time||"")));
    if (state.hwhen !== "upcoming") list.reverse();
    const today = new Date().toISOString().slice(0,10);
    const up = HEARINGS.filter(h => (h.date||"") >= today).length;
    $("#n-hearings").textContent = `(${up} upcoming)`;
    $("#hcount").textContent = `Showing ${list.length} hearing${list.length === 1 ? "" : "s"}`;
    $$("[data-hfilter]").forEach(el => el.classList.toggle("active", !!(state.hf[el.dataset.hfilter] || []).length));
    const billsHtml = h => {
      const details = h.bill_details && h.bill_details.length ? h.bill_details
        : (h.bills || []).map(no => { const b = BILLS.find(x => x.bill_no === no); return b ? {name: b.name, title: b.short_title || b.long_title, url: b.url} : {name: no, title: "", url: ""}; });
      if (!details.length) return `<div class="desc">${esc(h.description)}</div>`;
      return details.map(d => `<div class="bt">${d.url ? `<a href="${esc(d.url)}" target="_blank" rel="noopener">${esc(d.name)}</a>` : esc(d.name)} — ${esc(trunc(d.title, 200))}</div>`).join("");
    };
    $("#hcards").innerHTML = list.map(h => {
      const past = (h.date||"") < today;
      return `<div class="hcard ${past ? "past" : ""}">
        <div><div class="date">${esc(fmtDate(h.date))}</div><div class="time">${esc(h.time || "")}${h.room ? ` · Room ${esc(h.room)}` : ""}</div></div>
        <div>
          <div class="committee">${esc(h.committee)}${h.status ? `<span class="tag-cancel">${esc(h.status)}</span>` : ""}${!past && h.stream_url ? `<a class="live" href="${esc(h.stream_url)}" target="_blank" rel="noopener">Watch live ↗</a>` : ""}</div>
          ${billsHtml(h)}
          <div style="margin-top:5px">${(h.topics||[]).map(t => `<span class="chip">${esc(t)}</span>`).join("")}</div>
          ${(h.matched_keywords||[]).length ? `<div class="why">Matched: ${esc(h.matched_keywords.join(", "))}${(h.matched_by||[]).length ? ` (${esc(h.matched_by.join(", ").toLowerCase())})` : ""}</div>` : ""}
        </div>
      </div>`; }).join("") || `<div class="empty tablewrap">No ${state.hwhen === "all" ? "" : state.hwhen + " "}hearings on tracked topics.</div>`;
  }
  $("#hq").addEventListener("input", e => { state.hq = e.target.value; save(); renderHearings(); });
  $("#hexport").addEventListener("click", () => {
    const list = HEARINGS.filter(h => hearingPasses(h))
      .sort((a, b) => ((a.date||"") + (a.time||"")).localeCompare((b.date||"") + (b.time||"")));
    if (!list.length) { alert("There are no hearings to export."); return; }
    XlsxWriter.download(XlsxWriter.build([{ name: "Hearings", columns: HEARING_COLS, rows: list.map(hearingRow),
      title: `Kansas legislation hearings — exported ${stamp()} — ${list.length} shown · Filters: ${filterSummary(true)}` }]),
      `KS-hearings-${today10()}.xlsx`);
  });
  $("#hwhen").addEventListener("change", e => { state.hwhen = e.target.value; save(); renderHearings(); });

  // ---------------------------------------------------------------- tabs
  $$(".tab").forEach(t => t.addEventListener("click", () => {
    $$(".tab").forEach(x => x.classList.toggle("active", x === t));
    $("#tab-bills").hidden = t.dataset.tab !== "bills";
    $("#tab-hearings").hidden = t.dataset.tab !== "hearings";
  }));

  // ---------------------------------------------------------------- Excel-style filter popover
  const pop = $("#pop"); let popCtx = null;
  function openFilter(anchor, key, isHearing) {
    const items = isHearing ? HEARINGS.filter(h => hearingPasses(h, key)) : BILLS.filter(b => billPasses(b, key));
    const all = isHearing ? HEARINGS : BILLS;
    const counts = {};
    items.forEach(it => valuesOf(it, key).forEach(v => counts[v] = (counts[v] || 0) + 1));
    let values = [...new Set(all.flatMap(it => valuesOf(it, key)))];
    if (key === "topics") values = [...TOPICS, ...values.filter(v => !TOPICS.includes(v))];
    else if (key === "stage") values.sort((a, b) => STAGE_ORDER.indexOf(a) - STAGE_ORDER.indexOf(b));
    else values.sort();
    const store = isHearing ? state.hf : state.f;
    const current = store[key] && store[key].length ? new Set(store[key]) : new Set(values);
    popCtx = { key, isHearing, values, sel: current };
    $("#pop-title").textContent = FILTER_LABELS[key] || key;
    $("#pop-search").value = "";
    drawList();
    pop.classList.add("open");
    const r = anchor.getBoundingClientRect();
    const left = Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - pop.offsetWidth - 10);
    pop.style.left = Math.max(10, left) + "px";
    pop.style.top = (r.bottom + window.scrollY + 4) + "px";
    function drawList() {
      const term = $("#pop-search").value.toLowerCase();
      const shown = popCtx.values.filter(v => v.toLowerCase().includes(term));
      const allOn = shown.every(v => popCtx.sel.has(v));
      $("#pop-list").innerHTML = `<label class="all"><input type="checkbox" data-all ${allOn ? "checked" : ""}> (Select all)</label>` +
        shown.map(v => `<label><input type="checkbox" value="${esc(v)}" ${popCtx.sel.has(v) ? "checked" : ""}> ${esc(v)}<span class="c">${counts[v] || 0}</span></label>`).join("");
      popCtx.shown = shown;
    }
    popCtx.redraw = drawList;
  }
  $("#pop-search").addEventListener("input", () => popCtx && popCtx.redraw());
  $("#pop-list").addEventListener("change", e => {
    const cb = e.target; if (!popCtx) return;
    if (cb.hasAttribute("data-all")) popCtx.shown.forEach(v => cb.checked ? popCtx.sel.add(v) : popCtx.sel.delete(v));
    else cb.checked ? popCtx.sel.add(cb.value) : popCtx.sel.delete(cb.value);
    popCtx.redraw();
  });
  const closePop = () => { pop.classList.remove("open"); popCtx = null; };
  $("#pop-cancel").addEventListener("click", closePop);
  $("#pop-clear").addEventListener("click", () => { if (!popCtx) return; const s = popCtx.isHearing ? state.hf : state.f; delete s[popCtx.key]; save(); popCtx.isHearing ? renderHearings() : renderBills(); closePop(); });
  $("#pop-ok").addEventListener("click", () => {
    if (!popCtx) return;
    const s = popCtx.isHearing ? state.hf : state.f;
    const sel = popCtx.values.filter(v => popCtx.sel.has(v));
    if (sel.length === popCtx.values.length) delete s[popCtx.key]; else s[popCtx.key] = sel;
    save(); popCtx.isHearing ? renderHearings() : renderBills(); closePop();
  });
  document.addEventListener("click", e => {
    const b = e.target.closest("[data-filter],[data-hfilter]");
    if (b) { e.stopPropagation(); const h = !!b.dataset.hfilter; openFilter(b, b.dataset.filter || b.dataset.hfilter, h); return; }
    if (pop.classList.contains("open") && !pop.contains(e.target)) closePop();
  });
  document.addEventListener("keydown", e => { if (e.key === "Escape") { closePop(); rmodal.classList.remove("open"); } });
})();
</script>
</body>
</html>
